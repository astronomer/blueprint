dag_id: legacy_pipeline
schedule: "@daily"
description: Pinned to v1 of both blueprints; unaffected by the v2 rollout

steps:
  # Explicit `version: 1`. Without it this step would get the latest version,
  # whose config it does not match.
  extract_customers:
    blueprint: extract
    version: 1
    source_table: raw.customers
    batch_size: 500

  load_customers:
    blueprint: load
    version: 1
    depends_on: [extract_customers]
    target_table: analytics.customers
