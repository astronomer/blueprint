dag_id: payments_ledger
schedule: "@hourly"
description: Critical-tier DAG; gets 5 retries, a 2h timeout and failure email

# team is required by ProjectDagArgsConfig -- omitting it fails the build.
team: payments
tier: critical

steps:
  extract_transactions:
    blueprint: extract
    source: payments_api

  load_ledger:
    blueprint: load
    depends_on: [extract_transactions]
    target: analytics.ledger
