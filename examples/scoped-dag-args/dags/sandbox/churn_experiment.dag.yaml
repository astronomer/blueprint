dag_id: churn_experiment
schedule: "@daily"
description: Prototype; built with dags/sandbox/dag_args.py

# expires and author come from SandboxDagArgsConfig. Quoted, because unquoted
# YAML dates parse as a date object and the field is a string.
expires: "2026-12-31"
author: dana

steps:
  read_signals:
    blueprint: read
    dataset: raw.product_events

  write_scores:
    blueprint: write
    depends_on: [read_signals]
    table: sandbox.churn_scores
