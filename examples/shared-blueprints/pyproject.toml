[project]
name = "shared-blueprints"
version = "0.1.0"
description = "Example central-team blueprint package, discovered via entry points"
requires-python = ">=3.10"
dependencies = [
    "airflow-blueprint",
]

# Advertising under this group ("airflow_blueprint.blueprints") is what lets BlueprintRegistry
# discover this package's blueprints automatically once installed.
[project.entry-points."airflow_blueprint.blueprints"]
shared_blueprints = "shared_blueprints"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shared_blueprints"]
