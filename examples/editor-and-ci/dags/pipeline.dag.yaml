# yaml-language-server: $schema=../schemas/dag.schema.json
#
# That modeline is all the editor needs: completion and validation for the
# top-level keys of this file. See the README for what it does and does not
# cover.
dag_id: editor_demo
schedule: "@daily"
description: A DAG file wired up for editor validation

steps:
  extract_customers:
    blueprint: extract
    source: crm
    batch_size: 500

  load_customers:
    blueprint: load
    depends_on: [extract_customers]
    target: warehouse.customers
    mode: overwrite
