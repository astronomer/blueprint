name: Test Matrix

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        exclude:
          # Exclude some combinations to reduce CI load
          - os: macos-latest
            python-version: "3.9"
      fail-fast: false
    uses: ./.github/workflows/test-reusable.yml
    with:
      python-version: ${{ matrix.python-version }}
      os: ${{ matrix.os }}

  # The matrix above resolves the newest allowed Airflow, which is 3.x. The
  # examples are Airflow 3 only, so this job is what keeps the declared
  # apache-airflow>=2.5.0 support honest.
  test-airflow2:
    uses: ./.github/workflows/test-reusable.yml
    with:
      python-version: "3.11"
      airflow-version: "<3"

  integration-test:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Test CLI basic functionality
        run: uv run blueprint --help
        shell: bash

      # Iterates every directory under examples/, so a new example is covered
      # as soon as it is added. See examples/check.sh for what it runs.
      - name: Check examples
        run: uv run examples/check.sh
        shell: bash
