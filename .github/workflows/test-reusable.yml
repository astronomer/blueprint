name: Test (Reusable)

on:
  workflow_call:
    inputs:
      python-version:
        description: "Python version to test with"
        required: true
        type: string
      os:
        description: "Operating system to run on"
        required: false
        type: string
        default: "ubuntu-latest"
      airflow-version:
        description: >
          Optional pip version specifier for apache-airflow, e.g. "<3". When set,
          tests run in an isolated environment resolved against it instead of the
          project venv. Leave empty to use the version pyproject.toml resolves to.
        required: false
        type: string
        default: ""

jobs:
  test:
    runs-on: ${{ inputs.os }}

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true

      - name: Set up Python ${{ inputs.python-version }}
        run: uv python install ${{ inputs.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run tests
        if: inputs.airflow-version == ''
        run: |
          uv run pytest tests/ --ignore=tests/integration -v

      # `uv pip install` into the synced project venv will not downgrade
      # apache-airflow, so resolve a separate isolated environment instead.
      - name: Run tests against Airflow ${{ inputs.airflow-version }}
        if: inputs.airflow-version != ''
        run: |
          uv run --isolated --with "apache-airflow${{ inputs.airflow-version }}" \
            python -c "import airflow; print('airflow', airflow.__version__)"
          uv run --isolated --with "apache-airflow${{ inputs.airflow-version }}" \
            pytest tests/ --ignore=tests/integration -v
        shell: bash
