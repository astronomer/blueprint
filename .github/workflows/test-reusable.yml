name: Test (Reusable)

on:
  workflow_call:

jobs:
  unit:
    name: py${{ matrix.python-version }} / airflow ${{ matrix.airflow-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        airflow-version:
          ["2.10.5", "2.11.2", "3.0.6", "3.1.8", "3.2.2", "3.3.2"]
        exclude:
          - python-version: "3.13"
            airflow-version: "2.10.5"
          - python-version: "3.13"
            airflow-version: "2.11.2"
          - python-version: "3.13"
            airflow-version: "3.0.6"
          - python-version: "3.14"
            airflow-version: "2.10.5"
          - python-version: "3.14"
            airflow-version: "2.11.2"
          - python-version: "3.14"
            airflow-version: "3.0.6"
          - python-version: "3.14"
            airflow-version: "3.1.8"
        include:
          - os: macos-latest
            python-version: "3.14"
            airflow-version: "3.3.2"

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true

      - name: Install Airflow ${{ matrix.airflow-version }} on Python ${{ matrix.python-version }}
        run: scripts/install-airflow.sh "${{ matrix.airflow-version }}" "${{ matrix.python-version }}"

      - name: Run tests
        run: uv run --no-sync pytest tests/ --ignore=tests/integration -v

  test:
    needs: unit
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check that every matrix job passed
        run: test "${{ needs.unit.result }}" = success
